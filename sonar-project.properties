# SonarCloud settings for Kelasa Mitra.
#
# Duplication only. Nothing is excluded from bug, vulnerability or security-hotspot analysis.
#
# orchestrate/kelasa_tools/ is generated by orchestrate/build_kelasa_tools.py as a byte-for-byte
# copy of backend modules and data (backend/tests/test_orchestrate_package.py fails if it
# drifts), so it duplicates backend/ by design. Test folders repeat fixtures and stubs on purpose.
sonar.cpd.exclusions=orchestrate/kelasa_tools/**,backend/tests/**,frontend/src/test/**

sonar.python.version=3.11
